[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oauth-grant-effect-audit"
version = "0.1.0"
description = "Offline evidence checker for OAuth resource grants and server-observed effects"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Byung Hoon OH"}]
keywords = ["oauth", "mcp", "security", "authorization", "testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
grant-effect-audit = "grant_effect_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
